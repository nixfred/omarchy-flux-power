# gus — MSI Crosshair 16 Max HX (MS-2652), BIOS E2652IMS.506, EC 2652EMS1.303.
#
# WHY THIS FILE EXISTS: no shipped msi-ec knows this 2026 firmware. The
# in-tree driver refuses it outright ("Firmware version is not supported:
# '2652EMS1.303'") and upstream's config list stops at the 2025 generation,
# so without an override there is no charge_control_end_threshold at all and
# no way to cap charging. 182KIMS1.113 is the closest relative (2025
# Titan/Crosshair family).
#
# VERIFIED ON THIS BOARD, NOT ASSUMED (2026-09-12): with this override
# loaded, writing 60 / 80 / 100 to charge_control_end_threshold produced EC
# byte 0xd7 = bc / d0 / e4 — exactly `percent | BIT(7)` — with the start
# threshold trailing the end by 10. So 0xd7 really is this board's charge
# threshold register.
#
# ONLY THE CHARGE THRESHOLD IS TRUSTED FROM THIS BORROWED CONFIG.
# The same config's fan_mode, shift_mode and cooler_boost addresses are
# UNVERIFIED here. Do not write them; a wrong EC address can wedge the EC.
#
# The battery on this machine is BAT1, not BAT0:
#   /sys/class/power_supply/BAT1/charge_control_end_threshold
#
# Driver: msi-ec-dkms-git (AUR). Slider: Power Pulse (pi.power) >= 1.5.0,
# github.com/nixfred/power-pulse.
options msi-ec firmware=182KIMS1.113
