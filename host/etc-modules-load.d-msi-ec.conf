# Load msi-ec at boot so the battery charge limit exists.
#
# The module autoloads from its DMI alias (svn Micro-Star International) only
# when its firmware whitelist matches; on gus the EC is 2652EMS1.303, which no
# shipped config knows, so autoload never happens. Options for the firmware
# override live in /etc/modprobe.d/msi-ec.conf and explain the whole story.
#
# Without this file: no /sys/class/power_supply/BAT1/charge_control_end_threshold,
# and Power Pulse hides its CHARGE LIMIT slider because nothing is there to set.
msi-ec
